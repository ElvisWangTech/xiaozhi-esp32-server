# Tomcat
server:
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 1000
      min-spare: 30
  port: 8002
  servlet:
    context-path: /xiaozhi
    session:
      cookie:
        http-only: true

spring:
  # 环境 dev|test|prod
  profiles:
    active: dev
  messages:
    encoding: UTF-8
    basename: i18n/messages
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true
  main:
    allow-bean-definition-overriding: true

knife4j:
  enable: true
  basic:
    enable: false
    username: admin
    password: admin
  setting:
    enableFooter: false

renren:
  redis:
    open: true
  xss:
    enabled: true
    exclude-urls:

#mybatis
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: xiaozhi.modules.*.entity
  global-config:
    #数据库相关配置
    db-config:
      #主键类型
      id-type: ASSIGN_ID
    banner: false
  #原生配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  configuration-properties:
    prefix:
    blobType: BLOB
    boolValue: TRUE

# 基站定位（4G 设备 OTA 上报 cereg 时异步查询）
# 说明：基站定位与 IP 定位都只能得到城市级粗略位置，不可当作精确定位使用。
# 以下是默认值；智控台「参数管理 -> 服务端配置 -> 基站定位」中的
# server.cell_location.* 优先级更高，修改后下一次 OTA 上报即生效，无需重启。
xiaozhi:
  cell-location:
    enabled: true
    url: http://api.cellocation.com:84/cell/
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
    # 结果缓存有效期（小时），有效期内直接复用上一次接口返回
    cache-hours: 3
    # 同一基站并发查询去重锁的有效期（秒）
    inflight-seconds: 30